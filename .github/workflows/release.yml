name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/thorlens-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thorlens-signing/release.jks"

      - name: Test, lint, and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/thorlens-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Verify and package release
        shell: bash
        run: |
          mkdir -p dist
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/ThorLens-Extended-signer.txt
          cp "$APK" dist/ThorLens-Extended.apk
          cd dist
          sha256sum ThorLens-Extended.apk > ThorLens-Extended.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ThorLens-Extended
          path: dist/*
          if-no-files-found: error

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --prerelease --generate-notes
          --title "ThorLens Extended $GITHUB_REF_NAME"

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/thorlens-signing/release.jks"
